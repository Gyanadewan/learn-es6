<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Page</title>
</head>
<style>


   .prent-nav{
        background-color: aliceblue;
        border-radius: 5px;
   }

    .nav-container{
        max-width: 1000px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
       

    }

    .link-container  {
        display: flex;
         align-items: center;
         gap: 6px;
        list-style: none;
         

    }
  .link-container a{
      text-decoration: none;
  }


.login-btn{
    padding: 10px 30px;
    border: none;
    border-radius: 10px;
}
</style>
<body>
    <nav class="prent-nav">
            <div class="nav-container">
                <div>
                     <h3><span>Logo</span><span>Robot</span></h3>
                </div>
                  <ul class="link-container">
                    <li><a href="">Blogs</a></li>
                    <li><a href="">Contact</a></li>
                    <li><a href="">News</a></li>
                    <li><a href="">Project</a></li>

                 </ul>
             
                     <button class="login-btn">Login</button>
            </div>
                
                
      
    </nav>
</body>
</html>
